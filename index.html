<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F5F5F7" />
  <title>Achievement Unlock Intro Generator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">ACHIEVEMENT UNLOCK INTRO GENERATOR</p>
        <h1>游戏成就介绍卡片</h1>
        <p class="header-copy">在一张卡片中完成底图、Logo 与成就文案的精细编排。</p>
      </div>
      <div class="header-actions">
        <button class="button secondary" id="newArtwork" type="button">新建作品</button>
        <button class="button primary" id="headerExportPng" type="button">导出 PNG</button>
      </div>
    </header>

    <div class="mobile-tabs" role="tablist" aria-label="工作区切换">
      <button type="button" class="active" data-mobile-tab="editor" role="tab" aria-selected="true">编辑</button>
      <button type="button" data-mobile-tab="preview" role="tab" aria-selected="false">预览</button>
    </div>

    <section class="workspace">
      <aside class="panel controls" id="editorPanel" aria-label="编辑器设置">
        <details open>
          <summary>内容</summary>
          <div class="settings-stack">
            <label>主标题<input type="text" id="mainTitle" value="雕像也无法让她回心转意" maxlength="64" /></label>
            <p class="field-message" id="titleWarning" role="status"></p>
            <label>副标题<input type="text" id="subTitle" value="成就解锁" maxlength="64" /></label>
            <label>介绍文案<textarea id="description" rows="5" maxlength="500">它们毫无意义</textarea></label>
            <p class="field-message" id="descriptionWarning" role="status"></p>
            <label>字体
              <select id="fontFamily">
                <option value="system">系统黑体 / 简洁</option>
                <option value="song">宋体 / 文雅</option>
                <option value="kai">楷体 / 叙事</option>
                <option value="hei">思源黑体优先 / 现代</option>
              </select>
            </label>
            <div class="font-upload-line">
              <label class="compact-label">自定义字体<input type="file" id="fontInput" accept=".ttf,.otf,.woff,.woff2,font/*" /></label>
              <span class="file-status" id="fontStatus">未上传</span>
            </div>
          </div>
        </details>

        <details open>
          <summary>底图</summary>
          <div class="settings-stack">
            <section class="upload-card" id="backgroundUploadCard" tabindex="0" role="button" aria-label="上传底图，可点击、拖拽或粘贴图片">
              <input type="file" id="backgroundInput" accept="image/png,image/jpeg,image/webp" hidden />
              <div class="upload-preview" id="backgroundThumb" aria-hidden="true"></div>
              <div class="upload-copy"><strong id="backgroundUploadTitle">上传底图</strong><span id="backgroundFileName">PNG、JPEG、WebP，最大 20MB</span></div>
              <span class="upload-action">选择文件</span>
            </section>
            <div class="asset-actions"><button class="button small secondary" id="replaceBackground" type="button">替换</button><button class="button small tertiary" id="clearBackground" type="button">移除</button></div>
            <p class="field-message" id="backgroundError" role="alert"></p>
            <div class="quick-actions" data-asset="background"><button type="button" data-action="fit">适应</button><button type="button" data-action="fill">填满</button><button type="button" data-action="center">居中</button><button type="button" data-action="reset">复原</button></div>
            <div id="backgroundRangeControls"></div>
          </div>
        </details>

        <details>
          <summary>Logo</summary>
          <div class="settings-stack">
            <section class="upload-card" id="logoUploadCard" tabindex="0" role="button" aria-label="上传 Logo，可点击、拖拽或粘贴图片">
              <input type="file" id="logoInput" accept="image/png,image/jpeg,image/webp" hidden />
              <div class="upload-preview logo" id="logoThumb" aria-hidden="true"></div>
              <div class="upload-copy"><strong id="logoUploadTitle">上传 Logo</strong><span id="logoFileName">PNG、JPEG、WebP，最大 20MB</span></div>
              <span class="upload-action">选择文件</span>
            </section>
            <div class="asset-actions"><button class="button small secondary" id="replaceLogo" type="button">替换</button><button class="button small tertiary" id="clearLogo" type="button">移除</button></div>
            <p class="field-message" id="logoError" role="alert"></p>
            <label>Logo 样式<select id="logoStyle"><option value="floating">悬浮</option><option value="glass">玻璃底座</option></select></label>
            <div class="quick-actions" data-asset="logo"><button type="button" data-action="fit">适应</button><button type="button" data-action="fill">填满</button><button type="button" data-action="center">居中</button><button type="button" data-action="reset">复原</button></div>
            <div id="logoRangeControls"></div>
          </div>
        </details>

        <details>
          <summary>Liquid Glass</summary>
          <div class="settings-stack">
            <div class="preset-head"><span>材质预设</span><strong id="glassPresetLabel">标准</strong></div>
            <div class="glass-presets" id="glassPresets" aria-label="材质预设"></div>
            <button class="button secondary full-width" id="smartFit" type="button">智能适配底图</button>
            <p class="smart-summary" id="smartSummary" role="status"></p>
            <div id="glassRangeControls"></div>
            <div class="two-col">
              <label>强调色<input type="color" id="accentColor" value="#F5F7FF" /></label>
              <label>文字色<input type="color" id="textColor" value="#FFFFFF" /></label>
            </div>
            <div class="theme-block">
              <div class="mini-heading">推荐配色</div>
              <div class="theme-palette" id="themePalette"></div>
            </div>
          </div>
        </details>

        <details>
          <summary>排版与预览</summary>
          <div class="settings-stack">
            <div class="preset-head"><span>版式预设</span></div>
            <div class="layout-presets" id="layoutPresets" aria-label="版式预设"></div>
            <div id="typeRangeControls"></div>
          </div>
        </details>

        <div class="editor-footer-actions">
          <button class="button secondary" id="resetAdjustments" type="button">恢复默认参数</button>
          <button class="button tertiary" id="resetDemo" type="button">恢复示例</button>
        </div>
      </aside>

      <section class="preview-wrap" id="previewPanel">
        <header class="preview-toolbar">
          <div class="preview-title"><strong>作品预览</strong><span id="dpiInfo">1932×1360 高清 PNG</span></div>
          <div class="preview-actions">
            <button class="icon-button" id="undoButton" type="button" aria-label="撤销" title="撤销 (⌘/Ctrl+Z)">↶</button>
            <button class="icon-button" id="redoButton" type="button" aria-label="重做" title="重做 (⌘/Ctrl+Shift+Z)">↷</button>
            <span class="zoom-readout" id="zoomReadout">72%</span>
            <button class="button small primary" id="downloadPng" type="button">导出 PNG</button>
            <button class="button small secondary" id="downloadSvg" type="button">导出 SVG</button>
          </div>
        </header>
        <div class="preview-stage" id="previewStage" aria-label="作品预览画布">
          <div class="canvas-host" id="canvasHost">
            <svg id="achievementSvg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="游戏成就卡片预览"></svg>
            <div class="selection-layer" id="selectionLayer" aria-hidden="true"></div>
          </div>
          <p class="canvas-hint" id="canvasHint">点击底图或 Logo 后，可直接拖动；滚轮可缩放。</p>
        </div>
      </section>
    </section>
  </main>

  <nav class="mobile-bottom-bar" aria-label="移动端快捷操作">
    <button class="button secondary" id="mobilePreview" type="button">查看预览</button>
    <button class="button primary" id="mobileExport" type="button">导出 PNG</button>
  </nav>
  <div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>
  <script src="./app.js"></script>
</body>
</html>
